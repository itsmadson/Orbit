name: orbit

services:
  orbit-db:
    image: pgvector/pgvector:pg16
    container_name: orbit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit}
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - orbit-db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_EXTERNAL:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  orbit-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: orbit-api
    restart: unless-stopped
    depends_on:
      orbit-db:
        condition: service_healthy
    environment:
      ENV: ${ENV:-development}
      POSTGRES_HOST: orbit-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit}
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-orbit1234}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      ASSISTANT_API_BASE: ${ASSISTANT_API_BASE:-https://api.gapgpt.app/v1}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      GAPGPT_API_KEY: ${GAPGPT_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-glm-4-flash}
      ASSISTANT_TOOL_MODE: ${ASSISTANT_TOOL_MODE:-auto}
      ASSISTANT_TEMPERATURE: ${ASSISTANT_TEMPERATURE:-0.3}
      ASSISTANT_TIMEOUT: ${ASSISTANT_TIMEOUT:-120}
      ASSISTANT_MAX_STEPS: ${ASSISTANT_MAX_STEPS:-6}
      ASSISTANT_DAILY_LIMIT: ${ASSISTANT_DAILY_LIMIT:-100}
      ASSISTANT_MAX_INPUT: ${ASSISTANT_MAX_INPUT:-4000}
      INTEGRATION_SYNC_ENABLED: ${INTEGRATION_SYNC_ENABLED:-true}
      INTEGRATION_SYNC_SECONDS: ${INTEGRATION_SYNC_SECONDS:-300}
      # Outbound proxy for GitHub / GitLab / Jira / the model API, if the host needs one.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-orbit-db,localhost,127.0.0.1}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /data/files
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
    volumes:
      - orbit-files:/data/files
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  orbit-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ORBIT}
    container_name: orbit-web
    restart: unless-stopped
    depends_on:
      orbit-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ORBIT_API_URL: http://orbit-api:8000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ORBIT}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  orbit-db-data:
  orbit-files:
